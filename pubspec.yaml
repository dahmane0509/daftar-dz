name: daftar_dz
description: "دفتر الجملة الذكي v2.0.0 - كاشير وفواتير ومخزون وديون وكتالوج مصور لتجار الجملة والتجزئة"
publish_to: 'none'
version: 2.1.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  intl: ^0.19.0
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.1.4
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B2447"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/images/app_icon.png
